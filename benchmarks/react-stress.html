<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Kinetic Toast React Stress Harness</title>
		<link rel="stylesheet" href="../dist/styles.css" />
		<style>
			:root {
				color-scheme: dark;
				font-family:
					Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
					"Segoe UI", sans-serif;
			}

			body {
				min-height: 100vh;
				margin: 0;
				background: #09090b;
				color: #fafafa;
			}

			main {
				max-width: 900px;
				padding: 48px;
			}

			p {
				color: #a1a1aa;
				line-height: 1.6;
			}

			.controls {
				display: flex;
				flex-wrap: wrap;
				gap: 12px;
				margin: 32px 0;
			}

			button {
				border: 1px solid #3f3f46;
				border-radius: 999px;
				background: #18181b;
				color: #fafafa;
				cursor: pointer;
				font: inherit;
				padding: 10px 14px;
			}

			button:hover {
				background: #27272a;
			}

			pre {
				max-width: 760px;
				overflow: auto;
				border: 1px solid #27272a;
				border-radius: 16px;
				background: #18181b;
				padding: 16px;
				color: #d4d4d8;
			}
		</style>
		<script type="importmap">
			{
			  "imports": {
			    "@motionone/dom": "https://esm.sh/@motionone/dom@10.18.0",
			    "motion/react": "https://esm.sh/motion@12/react",
			    "react": "https://esm.sh/react@19",
			    "react-dom": "https://esm.sh/react-dom@19",
			    "react-dom/client": "https://esm.sh/react-dom@19/client",
			    "react/jsx-runtime": "https://esm.sh/react@19/jsx-runtime"
			  }
			}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module">
			import React from "react";
			import { createRoot } from "react-dom/client";
			import { kinetic, Toaster } from "../dist/index.mjs";

			const states = ["success", "error", "warning", "info", "action"];

			const burst = (count, options = {}) => {
				for (let i = 0; i < count; i += 1) {
					const type = states[i % states.length];
					kinetic.show({
						title: `${type} #${i + 1}`,
						description: "Stress toast for animation and stack profiling.",
						type,
						duration: 3000 + (i % 5) * 400,
						...options,
					});
				}
			};

			const promiseCycle = () => {
				for (let i = 0; i < 12; i += 1) {
					const delay = 500 + i * 100;
					kinetic.promise(
						new Promise((resolve) => setTimeout(() => resolve(i), delay)),
						{
							loading: { title: `Loading ${i + 1}` },
							success: (value) => ({
								title: `Resolved ${Number(value) + 1}`,
								description: "Promise transition completed.",
							}),
							error: { title: "Failed" },
						},
					);
				}
			};

			function App() {
				return React.createElement(
					React.Fragment,
					null,
					React.createElement(Toaster, {
						position: "top-right",
						theme: "system",
						closeButton: true,
						navigation: true,
					}),
					React.createElement(
						"main",
						null,
						React.createElement("h1", null, "Kinetic Toast stress harness"),
						React.createElement(
							"p",
							null,
							"Run after building the package. Use browser performance tooling to compare burst rendering, promise updates, navigation, and visual performance modes.",
						),
						React.createElement(
							"div",
							{ className: "controls" },
							React.createElement(
								"button",
								{ type: "button", onClick: () => burst(25) },
								"Burst 25",
							),
							React.createElement(
								"button",
								{ type: "button", onClick: () => burst(75) },
								"Burst 75",
							),
							React.createElement(
								"button",
								{
									type: "button",
									onClick: () => burst(75, { performanceMode: "minimal" }),
								},
								"Burst 75 minimal",
							),
							React.createElement(
								"button",
								{ type: "button", onClick: promiseCycle },
								"Promise cycle",
							),
							React.createElement(
								"button",
								{ type: "button", onClick: () => kinetic.clear() },
								"Clear",
							),
						),
						React.createElement(
							"pre",
							null,
							"bun run build\npython3 -m http.server 4173\nopen http://localhost:4173/benchmarks/react-stress.html",
						),
					),
				);
			}

			createRoot(document.getElementById("root")).render(React.createElement(App));
		</script>
	</body>
</html>
